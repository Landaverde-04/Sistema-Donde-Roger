{% extends 'navegacion.html' %}
{% load static %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src="{% static 'JS/registrar_producto.js' %}"></script> -->

    <title>Producto para Menu</title>
</head>
<div class="container mt-4 card shadow w-50">
    <div class="card-body">
        <form id="form-crear-producto" class="needs-validation" method="post"
            action="{% url 'registrar_producto_menu' %}">
            {% csrf_token %}
            <h4 class="card-title m-3 text-center">Registrar Producto</h4>
            <label for="nombre-producto" class="form-label">Nombre:</label>
            <input type="text" id="nombre-producto" name="nombre-producto" class="form-control" />

            <label for="tamanio-producto" class="form-label mt-2">Unidad (Porcion/Tamaño):</label>
            <input type="text" id="tamanio-producto" name="tamanio-producto" class="form-control" />

            <label for="descripcion-producto" class="form-label mt-2">Descripción:</label>
            <textarea id="descripcion-producto" name="descripcion-producto" class="form-control" rows="3"></textarea>
            <div class="d-flex mt-3">
                <div class="flex-column mx-2">
                    <label for="precio-producto" class="form-label">Precio unitario:</label>
                    <input type="number" id="precio-producto" name="precio-producto" class="form-control w-100"
                        placeholder="0.00" />
                </div>
                <div class="flex-column w-75 mx-2">
                    <label for="categoria-producto" class="form-label">Categoria:</label>
                    <select id="categoria-producto" name="categoria-producto" class="form-select w-100">
                        {% for categoria in categorias %}
                        <option value="{{categoria.idCategoriaProductoMenu}}">{{categoria.nombreCategoriaProductoMenu}}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-3">

                <button type="submit" class="btn btn-success w-50 my-2 me-2">Registrar</button>
                <button type="button" class="btn btn-danger w-50 my-2 me-2">Cancelar</button>
            </div>

        </form>

    </div>
</div>
{% endblock %}
