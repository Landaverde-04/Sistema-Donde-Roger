{% extends 'navegacion.html' %}
{% block content %}
<div class="container mt-4" style="max-width:540px">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white">Eliminar mantenimiento</div>
    <div class="card-body">
      <p>¿Eliminar definitivamente el mantenimiento <b>#{{ mantenimiento.idMantenimiento }}</b> de <b>{{ mantenimiento.maquinaria }}</b>?</p>
      <form method="post">{% csrf_token %}
        <div class="d-flex gap-2">
          <button class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'lista_mantenimiento' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
