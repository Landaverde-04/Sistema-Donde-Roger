{% extends 'navegacion.html' %}
{% block content %}
<div class="container mt-3" style="max-width:720px">
  <h3 class="mb-3">Registrar maquinaria</h3>
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-7">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombreMaquinaria" class="form-control" required>
      </div>
      <div class="col-md-5">
        <label class="form-label">Fecha de compra</label>
        <input type="date" name="fechaCompraMaquinaria" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Marca</label>
        <input type="text" name="marcaMaquinaria" class="form-control" required>
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary">Guardar</button>
      <a class="btn btn-secondary" href="{% url 'lista_maquinaria' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
