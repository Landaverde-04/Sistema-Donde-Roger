<!DOCTYPE html>
<html lang="en">
    {% extends 'navegacion.html' %} {% load static %} {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="{% static 'JS/editar_cliente.js' %}"></script>
    <title>Editar cliente</title>
</head>
<body>
<div class="container mt-3">
  <h2>Editar Cliente</h2>
  <form method="post">
    {% csrf_token %}

    <!-- Datos Cliente -->
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" name="nombreCliente" class="form-control" value="{{ cliente.nombreCliente }}">
    </div>
    <div class="mb-3">
      <label>Apellido</label>
      <input type="text" name="apellidoCliente" class="form-control" value="{{ cliente.apellidoCliente }}">
    </div>
    <div class="mb-3">
      <label>DUI</label>
      <input type="text" name="duiCliente" class="form-control" value="{{ cliente.duiCliente }}">
    </div>
    <div class="mb-3">
      <label>Teléfono</label>
      <input type="text" name="telefonoCliente" class="form-control" value="{{ cliente.telefonoCliente }}">
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="emailCliente" class="form-control" value="{{ cliente.emailCliente }}">
    </div>
    <div class="mb-3">
      <label>Fecha de nacimiento</label>
      <input type="date" name="nacimientoCliente" class="form-control" value="{{ cliente.nacimientoCliente|date:'Y-m-d' }}">
    </div>

  <!-- Direcciones -->
<h4>Direcciones</h4>
<div id="direcciones">
  {% for direccion in direcciones %}
<div class="direccion mb-2 d-flex align-items-center">
  <input type="hidden" name="direccion_id" value="{{ direccion.idDireccion }}">
<input type="hidden" name="direccion_eliminar" value="0" class="direccion-eliminar">

  <input type="text" name="direccion_texto" class="form-control me-2" value="{{ direccion.direccion }}">
  <button type="button" class="btn btn-danger btn-sm eliminar-direccion" 
          data-id="{{ direccion.idDireccion }}" 
          data-texto="{{ direccion.direccion }}">
    Eliminar
  </button>
</div>
  {% endfor %}
</div>

<button type="button" id="agregarDireccion" class="btn btn-secondary mt-2">Agregar dirección</button>


    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </div>
  </form>
</div>

<!-- Modal Confirmación -->
<div class="modal fade" id="modalConfirmarEliminarDireccion" tabindex="-1" aria-labelledby="confirmarEliminarDireccionLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title" id="confirmarEliminarDireccionLabel">
          <i class="bi bi-exclamation-triangle"></i> Aviso
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        ¿Estás seguro de eliminar la dirección:  
        <strong id="modalTextoDireccion"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="btnConfirmarEliminarDireccion" class="btn btn-danger">Sí, eliminar</button>
      </div>
    </div>
  </div>
</div>




</body>
</html>
{% endblock %}
